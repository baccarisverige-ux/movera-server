# Render Blueprint for the test server (docs/DEPLOY_RENDER.md): the server as one Docker web service
# plus its PostgreSQL, both in Frankfurt. Paid plans (owner 2026-11-04): web "standard" ($25, 1 CPU 2 GB, never sleeps) and
# database "basic-1gb" ($19, never expires). MOVERA_ENV=staging keeps the test numbers.
# The test accounts, sample settings and first admin are made at start (SEED_TEST_ON_START,
# ADMIN_BOOTSTRAP_EMAIL).
services:
  - type: web
    name: movera-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: standard
    healthCheckPath: /readyz
    envVars:
      - key: MOVERA_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: movera-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Render's load balancer sits in front of the server.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # The apps' live web builds on GitHub Pages.
      - key: CORS_ORIGINS
        value: https://baccarisverige-ux.github.io
      - key: ADMIN_PANEL_URL
        value: https://baccarisverige-ux.github.io/Admin-panel-movera-dispatch/live/
      # Test accounts, sample settings and the first admin at start (the free plan has no shell).
      - key: SEED_TEST_ON_START
        value: "true"
      # Your e-mail: the admin's password link appears in the service's Logs.
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      # Forgot password: set to any new text to get one new password link in Logs (docs/DEPLOY_RENDER.md).
      - key: ADMIN_PASSWORD_RESET
        sync: false
      # Optional second Super admin for automated staging checks; its password link appears in Logs too.
      - key: ADMIN_TEST_EMAIL
        sync: false
      # Address search; filled in Render's dashboard (never committed).
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # Push (contract v0.18.3 R7): the Firebase service account JSON; filled in Render's dashboard (never committed).
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # G30b (owner Q1): Resend's API key for the e-mail change codes; filled in Render's dashboard (never committed).
      - key: RESEND_API_KEY
        sync: false
      # Road routes and distances for the test week (the rider's map draws the road, not a straight line). The public
      # OSRM demo server is for trying things out only; Movera's own OSRM replaces it (docs/DECISIONS.md, decision 4).
      - key: OSRM_URL
        value: https://router.project-osrm.org

databases:
  - name: movera-db
    region: frankfurt
    plan: basic-1gb
    postgresMajorVersion: "16"
    databaseName: movera
    user: movera
