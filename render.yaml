# Render Blueprint for the test week (docs/DEPLOY_RENDER.md): the server as one Docker web service plus its
# PostgreSQL, both in Frankfurt. MOVERA_ENV=staging keeps the test numbers (code 1234) and seed-test available.
services:
  - type: web
    name: movera-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: starter
    healthCheckPath: /readyz
    envVars:
      - key: MOVERA_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: movera-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Render's load balancer sits in front of the server.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # The apps' live web builds on GitHub Pages.
      - key: CORS_ORIGINS
        value: https://baccarisverige-ux.github.io
      - key: ADMIN_PANEL_URL
        value: https://baccarisverige-ux.github.io/Admin-panel-movera-dispatch/live/
      # Address search; filled in Render's dashboard (never committed).
      - key: GOOGLE_MAPS_API_KEY
        sync: false

databases:
  - name: movera-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: movera
    user: movera
