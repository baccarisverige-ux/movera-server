# Keep the live test server awake (owner 2026-11-03, LT-1: "Stay free + keep awake").
# Render's free plan puts the web service to sleep after ~15 minutes without requests; the first call after that waits
# 30-60 s. This job calls the public, read-only GET /healthz every 10 minutes so the server stays awake.
# No secrets are used. Note: GitHub runs scheduled jobs on a best-effort basis — a run can start late or be skipped
# when GitHub is busy, and GitHub turns off schedules in a repository with no activity for 60 days.
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /healthz
        run: |
          # Up to 3 tries: a sleeping server can take a minute to wake. Never fails the job on a slow wake.
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 70 https://movera-server.onrender.com/healthz || true)
            echo "try $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::server did not answer 200 on /healthz"
