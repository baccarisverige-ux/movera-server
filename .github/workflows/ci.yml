name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Owner 2026-11-06: a push to main runs a quick check only (contract,
  # typecheck, lint, build); the full test suite runs on PRs (not drafts) and
  # every 12 hours on main (skipped when main has no new commit in 13 hours).
  # Step 48 (2026-11-09): a manual run is allowed on main only; there is no
  # manual full run on a draft branch (run the suite locally, then mark Ready once).
  schedule:
    - cron: '41 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push cancels the older run of the same workflow on the same ref
  # (pull request refs and branch refs are different groups).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI cost cut (owner 2026-11-06): docs-only pull requests and drafts skip the
  # heavy jobs. paths-ignore is not used on pull_request here because the
  # required checks would then never report and the PR would wait forever; a
  # skipped job reports as passed, so branch protection still works.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            since="$(date -u -d '13 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
            n="$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&since=$since" --jq 'length')"
            echo "commits on main since $since: $n"
            if [ "$n" = 0 ]; then echo "code=false" >> "$GITHUB_OUTPUT"; else echo "code=true" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          if [ -z "$PR" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          # Any file that is not *.md and not under docs/ counts as code.
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$files"

  checks:
    needs: [changes]
    # Not on drafts; a manual run (workflow_dispatch) only on main (step 48).
    if: >-
      needs.changes.outputs.code == 'true'
      && github.event.pull_request.draft != true
      && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: movera
          POSTGRES_PASSWORD: movera
          POSTGRES_DB: movera
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U movera"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://movera:movera@127.0.0.1:5432/movera
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration check diffs against the PR base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: File size ratchet (Rule 25)
        run: python3 tools/size_ratchet.py
      - run: npm ci
      - run: npm run contract:verify
      # Owner rule 46 (step 58): new migration files must not lock a table and must carry an undo step.
      # Pull requests only; a push to main checks nothing here (the files already passed on their PR).
      - name: Migration safety check (new files vs base branch)
        if: github.event_name == 'pull_request'
        run: |
          python3 tools/check_migrations.py --self-test
          python3 tools/check_migrations.py --base "origin/${{ github.base_ref }}"
      - run: npm run typecheck
      - run: npm run lint
      - name: npm audit (production deps, high and above)
        run: npm run audit:prod
      # Quick check on a push to main (owner 2026-11-06): no tests there; the
      # same commit already passed them on its PR, and the 12-hour run re-tests main.
      - name: Tests with coverage (floors in vitest.config.ts)
        if: github.event_name != 'push'
        run: npm run test:coverage
      - name: Upload coverage report
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
