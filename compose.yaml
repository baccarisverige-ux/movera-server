# Local stack: docker compose up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: movera
      POSTGRES_PASSWORD: movera
      POSTGRES_DB: movera
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movera"]
      interval: 2s
      retries: 30
  server:
    build: .
    environment:
      MOVERA_ENV: development
      DATABASE_URL: postgres://movera:movera@postgres:5432/movera
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
